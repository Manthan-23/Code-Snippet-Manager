.textarea{
    align-items: center;
    align-content: center;
    
    color: #666666;
   border: 2px solid transparent;

  font-size: 16px;

  background: #F0F1F8;
  border-radius: 6px;
  transition: all 0.2s;

}

}

.button:hover{
    background-color: white;
    transition: 0.7s;
    cursor: pointer;
}


.textarea2{
    position: relative;

    color: #666666;
   border: 2px solid transparent;

  font-size: 16px;

}

    cursor: pointer;

#title-input {
 width: 600px;
 height: 40px;
 padding: 0 15px;
 font-size: 18px;
 border: 2px solid grey;
 border-radius: 2px;
 outline: none;
 color: white;
 background-color: transparent;
 transition: border-color 0.2s; /* add a transition for the border color */
}

    width: 700px;
    height: 200px;
    margin-top: 1rem;
}

form{
    display: flex;
    justify-content: left;
    flex-direction: column;
    
}

    margin-right: 10rem;

        <div class="navbar" align="center">
            <div class="icon">
                <h2 class="logo">Snipp It</h2>
            </div>


            <div class="search">
                <input class="srch" type="search" name="" placeholder="Type To text">
                <a href="#"> <button class="btn">Search</button></a>
            </div>
            
            
            

        </div> 
        
        
        
        <!--<div class="container">-->
            <div class="main-heading">Add your Public Snippet</div>
        
            <div class="form-align">
        <form th:action="@{/saveSnippet}" modelAttribute="data" method="POST" onsubmit="updateEditorContent(event)">
            
            <input id="title-input" path="title" name="title" field="*{title}" cols="50" rows="2" placeholder="Enter the title"></input>
            
            <!--<textarea id="editor-container" class="textarea" path="post" name="post" field="*{post}" cols="100" rows="7" placeholder="Enter your Snippet"></textarea>-->
            <!--<input type="hidden" path="post" name="post" field="*{post}" />-->
            
            
            <div id="editor" path="post" name="post" field="*{post}" ></div>
            
            <input type="hidden" id="editorContent" name="post" field="*{post}" />
            
            
            <button type="submit" class="button">Add Snippet</button>    
        </form>
            </div>
        
        
        <!--</div>-->
        
        <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.32.1/min/vs/loader.js"></script>

        <script>
            
            document.getElementById('title-input').addEventListener('click', function() {
 this.style.borderColor = '#ff7200';
});

document.getElementById('title-input').addEventListener('blur', function() {
 this.style.borderColor = 'grey';
});
            
            var myEditor; // Variable to store the editor instance

    function updateEditorContent() {
        var editorContent = myEditor.getValue();
        document.getElementById('editorContent').value = editorContent;
    }
