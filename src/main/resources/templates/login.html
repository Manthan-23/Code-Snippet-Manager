        <style>
            
            *{
                background: black;

            .form{
    width: 250px;
    height: 400px;
    background: black;
    position: absolute;
    top: 100px;
    left: 550px;
    text-align: center;
    align-content: center;
    align-items: center;
    transform: translate(0%,-5%);
    border-radius: 10px;
    padding: 25px;
}

.form h2{
    width: 220px;
    font-family: 'Poppins';
    text-align: center;
    color: #ff7200;
    font-size: 22px;
    background-color: white;
    border-radius: 10px;
    margin: 2px;
    padding: 8px;
}

.form input{
    width: 240px;
    height: 35px;
    background: transparent;
    border-bottom: 1px solid #ff7200;
    border-top: none;
    border-right: none;
    border-left: none;
    color: white;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 1px;
    margin-top: 30px;
    font-family: 'Poppins';
}

.form input:focus{
    outline: none;
}

::placeholder{
    color: white;
    font-family: Arial;
}

.btnn{
    width: 240px;
    height: 40px;
    background: #ff7200;
    border: none;
    margin-top: 30px;
    font-family: 'Poppins';
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    transition: 0.4s ease;
}
.btnn:hover{
    background: white;
    color: #ff7200;
}
.btnn a{
    text-decoration: none;
    color: #000;
    font-weight: bold;
}
.form .link{
    font-family: 'Poppins';
    font-size: 17px;
    color: white;
    padding-top: 20px;
    text-align: center;
}
.form .link a{
    text-decoration: none;
    color: #ff7200;
}
.liw{
    color: white;
    font-family: 'Poppins';
    padding-top: 2px;
    padding-bottom: 10px;
    text-align: center;
}
.icons a{
    text-decoration: none;
    color: white;
}
.icons ion-icon{
    color: white;
    font-size: 30px;
    padding-left: 14px;
    padding-top: 0px;
    transition: 0.3s ease;
}
.icons ion-icon:hover{
    color: #ff7200;
}

                    <form action="loginuser" modelAttribute="user">
                    
                    <h2>Login Here</h2>
                    <input path="email" name="email" placeholder="Enter Email Here" field="*{email}" required>
                    <div class="password-container">
                    <input type="password" id="passwordField" path="password" name="password" placeholder="Enter Password Here" field="*{password}" required>
                    
                    </div>
                    <button type="submit" class="btnn">Login</button>

                    <p class="link">Don't have an account<br>
                    <a href="showUserForm">Sign up </a> here</p>
                    <p class="liw">Log in with</p>

                        <a href="#"><ion-icon name="logo-google"></ion-icon></a>
                        <a href="#"><ion-icon name="logo-skype"></ion-icon></a>
                    </div>
                    
                    </form>
