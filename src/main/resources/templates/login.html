            <script th:inline="javascript">
        /*<![CDATA[*/
        function clearMessage() {
            setTimeout(function () {
                var messageElement = document.getElementById('message');
                if (messageElement) {
                    messageElement.remove();
                }
            }, 4000); // 5000 milliseconds (5 seconds)
        }
        
        
        /*]]>*/
    </script>

 <div id="message-container" th:if="${error}">

                <div class="heading">Log In</div>
    <div class="eclipse-1"></div>
    <div class="eclipse-2"><svg xmlns="http://www.w3.org/2000/svg" width="184" height="182" viewBox="0 0 184 182"

            <defs>

                    <stop stop-color="#FF4D00" />
                    <stop offset="1" stop-color="#FF4D00" stop-opacity="0" />
                </linearGradient>
            </defs>

    <form action="loginuser" modelAttribute="user" onsubmit="return handleFormSubmission()">
    <div class="main">
        
        <input class="input-1" placeholder="Email" path="email" name="email" field="*{email}" required/>
        <input class="input-1" placeholder="Password" type="password" id="passwordField" path="password" name="password" field="*{password}" required/>
        <div class="forgot"><a href="forgot-send-otp" style="text-decoration: none; color: white;">Forgot Password?</a></div>
        <button type="submit" class="button-1">Log In</button>
    </div>
    </form>
    
    


    

 </body>

                <script>
                     function handleFormSubmission() {
        
        var message = /*[[${message}]]*/ null;
        var error = /*[[${error}]]*/ null;

        if (message) {
            alert(message); // Display a success message alert
        } else if (error) {
            alert(error);   // Display an error message alert
        }

        return true; // Proceed with form submission (or false to cancel)
    }


                </script>
