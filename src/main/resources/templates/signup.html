        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        
        function myFunction() {
            if(!alert('You have registered successfully! Please Log In to continue.'));

        <style>
            
        


* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;

        }

        .heading {
            color: #FFF;
            margin-left: 20rem;
            margin-top: 3rem;
            font-family: 'Inter';
            font-size: 50px;
            font-style: normal;
            font-weight: 600;
            line-height: normal;
        }

        .eclipse-1 {
            width: 450px;
            height: 450px;
            flex-shrink: 0;
            border-radius: 574px;
            background: radial-gradient(365.8% 354.89% at 247.65% -101.16%, #FF4D00 0%, rgba(255, 77, 0, 0.20) 56.77%, rgba(255, 77, 0, 0.00) 70.84%);
        }

        input {
            border-radius: 28.5px;
            border: 3px solid #FF4D00;
            /* Set the border color to orange */
            width: 450px;
            height: 42px;
            background-color: transparent;
            color: white;
            padding: 10px;
            font-size: 1rem;
            margin-bottom: 2rem;
        }



        .main {
            display: flex;
            position: relative;
            justify-content: center;
            flex-direction: column;
            align-items: center;

            margin-top: -36rem;
        }

        .button-1 {
            width: 100px;
            margin-top: 2rem;
            height: 35px;
            border: none;
            border-radius: 22.896px;
            background-color: #FF4D00;
            cursor: pointer;
            color: white;
            font-size: 0.8rem;
        }

        .eclipse-2 {
            position: relative;
            width: 180.306px;
            height: 182.329px;
            transform: rotate(-78.771deg);
            flex-shrink: 0;
            fill: linear-gradient(213deg, #FF4D00 -321.7%, rgba(255, 77, 0, 0.00) 55.25%);
            margin-left: 65rem;
            top: -30rem;

        }

        .already{
            color: #FFF;
cursor: pointer;
font-family: 'Inter';
font-size: 15.088px;
font-style: normal;
font-weight: 300;
line-height: normal;
font-family: 'Inter';
        }
        </style>
        
       

<body>

            <div class="heading">Sign up</div>
    <div class="eclipse-1"></div>
    <div class="eclipse-2"><svg xmlns="http://www.w3.org/2000/svg" width="184" height="182" viewBox="0 0 184 182"
            fill="none">
            <ellipse cx="91.9752" cy="91.18" rx="90.153" ry="91.1646" transform="rotate(-78.7708 91.9752 91.18)"
                fill="url(#paint0_linear_30_47)" />
            <defs>
                <linearGradient id="paint0_linear_30_47" x1="591.915" y1="-697.62" x2="74.4698" y2="95.512"
                    gradientUnits="userSpaceOnUse">
                    <stop stop-color="#FF4D00" />
                    <stop offset="1" stop-color="#FF4D00" stop-opacity="0" />
                </linearGradient>
            </defs>
        </svg></div>
    
    
    <form action="publish" modelAttribute="user">

    <div class="main">
        <input class="input-1" path="email" name="email" field="*{email}" required placeholder="Email" />
        <input class="input-1" placeholder="Password" type="password" path="password" name="password" field="*{password}" required/>
        <input class="input-1" placeholder="First Name" path="firstName" name="firstName" field="*{firstName}" required/>
        <input class="input-1" placeholder="Last Name" path="lastName" name="lastName" field="*{lastName}" required/>
        <input class="input-1" placeholder="GitHub Username" path="username" name="username" field="*{username}" required/>
        <div class="already"><a href="login" style="text-decoration: none; color: white;">Already a user? Login</a></div>
        <button onclick="myFunction()" type="submit" class="button-1">Sign Up</button>
    </div>
        
    </form>
            
        <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
        
    </body>
