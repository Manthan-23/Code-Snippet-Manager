* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  text-decoration: none;
  font-family: 'Inter';
}

body {
  background: linear-gradient(

.wrapper {
  margin-top: 10px;
}

.wrapper .title {
  max-width: 500px;
  width: 100%;
  padding: 20px;
  margin: 0 auto 30px;
  position: relative;
  justify-content: space-between;

  text-align: center;
  font-size: 45px;
  margin-top: 150px;
 font-family: 'Inter';
  color: #ff7200;
}

.wrapper .team {
  width: auto;
  display: flex;
  justify-content: center;
  text-align: center;
  flex-wrap: wrap;
}

.wrapper .team .team_member {
  width: 325px;
  margin: 10px;
  background: white;
  border-radius: 6px;
  box-shadow: 0 2px 2px rgba(0, 0, 0, 0.034),
  0 6px 6px rgba(0, 0, 0, 0.048),
  0 1px 12px rgba(0, 0, 0, 0.06),
  0 2px 22px rgba(0, 0, 0, 0.072),
  0 4px 41px rgba(0, 0, 0, 0.086),
  0 1px 10px rgba(0, 0, 0, 0.12);
  padding: 25px;
}

.wrapper .team .team_member img {
  width: 80px;
}

.wrapper .team .team_member h3 {
  color: #444;
}

.wrapper .team .team_member span {
  font-size: 12px;
  color: #999;
}

.wrapper .team .team_member p {
  margin: 15px 0;
}

.wrapper .team .team_member .btn_grp {
  display: flex;
}

.wrapper .team .team_member .btn_grp a {
  background: #ddd;
  display: block;
  width: 125px;
  margin: 0 10px;
  padding: 10px;
  border-radius: 6px;
  color: #444;
  text-transform: capitalize;
  transition: all 0.3s ease;
}

.wrapper .team .team_member .btn_grp a:first-child:hover {
  background: #7bbb5e;
  color: #fff;
}

.wrapper .team .team_member .btn_grp a:last-child:hover {
  background: #3a8bbb;
  color: #fff;
}
