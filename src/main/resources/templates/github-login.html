        <input type="hidden" id="editorContentNew" name="post" field="*{post}" />
        <button type="submit" class="save">Save</button>
            </form>
        </div>

  <script>
    var editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
      lineNumbers: true,
      mode: "javascript",  // Set the mode based on the code language
      theme: "monokai"
    });

    var copyButton = document.getElementById("copy-button");
    copyButton.addEventListener("click", function() {
      editor.focus();
      document.execCommand("selectAll");
      document.execCommand("copy");
      // Optionally, provide feedback to the user
      alert("Code copied to clipboard!");
    });
    
    function openRepo(url) {
  var width = 800;
  var height = 600;
  var left = (screen.width - width) / 2;
  var top = (screen.height - height) / 2;

  var popupWindow = window.open('', '_blank', 'toolbar=yes,scrollbars=yes,resizable=yes,top=' + top + ',left=' + left + ',width=' + width + ',height=' + height);

  if (popupWindow) {
    // Load the GitHub repository URL into the popup window
    popupWindow.location.href = url;
  } else {
    // Handle if popup blocking is enabled
    alert('Popup window was blocked by the browser. Please allow popups for this site.');
  }
}
  </script>
